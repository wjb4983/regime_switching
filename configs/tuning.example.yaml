# Parameters are evaluated top-to-bottom so conditional parents come first.
parameters:
  model:
    type: categorical
    choices: [hmm, markov]
  states:
    type: int
    low: 2
    high: 6
  covariance:
    type: categorical
    choices: [diag, full]
    when:
      model: hmm
  regularization:
    type: float
    low: 0.0001
    high: 0.1
    log: true

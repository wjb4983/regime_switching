# Real MASSIVE ingestion for Starter-tier stocks/options plans.
provider: massive
plan: starter
symbol: SPY
output: artifacts/data/spy_massive_daily.parquet
options_output: artifacts/data/spy_massive_options.parquet
options_contracts_output: artifacts/data/spy_massive_option_contracts.parquet
start_date:
end_date:
max_history: true
adjusted: true
timespan: day
multiplier: 1
api_key: ${MASSIVE_API_KEY}
options:

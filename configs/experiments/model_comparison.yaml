# One-command baseline and candidate comparison; shared fragments remain authoritative.
name: daily_market_regime_model_comparison
work_dir: artifacts/experiments/model_comparison
source:
  config: ../synthetic/gaussian_hmm.yaml
features:
  config: ../features/core_market.yaml
model_catalog:
  root: ../models
validation:
  strategy: walk_forward
  train_size: 0.7
  test_size: 0.2
  n_splits: 4
  embargo_periods: 1
evaluation:
  metrics:
    - aligned_accuracy
    - balanced_accuracy
    - adjusted_rand_index
    - normalized_mutual_information
    - macro_f1
    - boundary_precision
    - boundary_recall
    - boundary_f1
    - recovery_score
    - regime_persistence
    - switching_frequency
    - occupancy_concentration
    - state_entropy
    - probability_entropy
    - transition_concentration
    - confidence_calibration
    - fit_seconds
    - prediction_coverage
  save_predictions: true
comparison:
  probability_kind: filtered
  execution_delay: 1
report:
  title: Daily market regime model comparison
  format: html
  output_dir: artifacts/reports
  include_sections: [summary, metrics, comparison]

# 1. Generate a small, reproducible daily market series.
generator: gaussian_hmm
output: artifacts/data/synthetic_gaussian_hmm.parquet
seed: 42
observations: 1000
frequency: 1D
start: 2020-01-01
states:
  - mean: 0.0005
    volatility: 0.008
  - mean: -0.0010
    volatility: 0.025
transition_matrix:
  - [0.98, 0.02]
  - [0.08, 0.92]

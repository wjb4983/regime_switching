# Extended deep example (outside the default quick start).
model: neural-hmm
input: artifacts/features/core_market.parquet
output: artifacts/models/deep/neural-hmm
features: [return_1d, realized_volatility_21d]
timestamp_column: timestamp
minimum_observations: 30
missing_value_policy: error
n_states: 2
random_seed: 42
fit_parameters:
  input_dim: 2
  hidden_dim: 16
  epochs: 5
